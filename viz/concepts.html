CONCEPTS.push({
  id: 'sample', num: '14', tag: 'sample_next_token · engine.py:140',
  title: 'Sampling',
  deck: 'Converting a probability distribution over 32k tokens into a single chosen token. Temperature, top-k, and a multinomial draw.',
  body: `
<section class="block">
  <p class="block-eyebrow">Purpose</p>
  <h2>Why does this exist?</h2>
  <p>After lm_head + softcap, the model emits a distribution over the entire vocabulary at every position. To actually generate text, we have to <strong>commit</strong> to one token per step. The naive choice is to always pick the highest-probability token (<em>greedy decoding</em>), but that has well-known pathologies: the output collapses into loops and repetitive boilerplate. On the other extreme, sampling purely from the distribution as-is occasionally picks bizarre low-probability tokens that derail the generation.</p>
  <p>Sampling-with-temperature-and-top-k is the standard middle ground: shape the distribution slightly to remove the long tail of unlikely tokens, then draw a sample. Cheap, simple, and the foundation of most chat models.</p>

  <div class="analogy">
    <div class="label">Analogy</div>
    <p>Imagine ordering off a menu. <strong>Greedy</strong> = always get the chef's #1 recommendation; you eat the same dish every time. <strong>Pure sampling</strong> = roll a die over the whole menu; you might get a wonderful surprise or a baffling dish you've never heard of. <strong>Top-k + temperature</strong> = the waiter shows you the top 50 most popular dishes for your meal preference (top-k), then you flip a coin biased toward the chef's favorites (temperature).</p>
  </div>

  <div class="whatif">
    <div class="label">What if we used greedy?</div>
    <p>Generations become deterministic, repetitive, and dull. Ask the same question twice, get the same answer. Worse, certain prompt structures cause greedy decoders to fall into loops: "I think therefore I think therefore I think therefore …". You can build code-completion or factoid systems on greedy, but for any open-ended generation you need sampling.</p>
  </div>
</section>

<section class="block">
  <p class="block-eyebrow">Implementation</p>
  <h2>How does it actually work?</h2>

  <h3>The three-step pipeline</h3>
  <pre class="code"><code class="language-python">def sample_next_token(logits, temperature=1.0, top_k=50, generator=None):
    if temperature == 0.0:
        return torch.argmax(logits, dim=-1)         # greedy shortcut
    logits = logits / temperature                   # 1. temperature
    if top_k is not None and top_k > 0:
        v, ix = torch.topk(logits, k=top_k, dim=-1) # 2. top-k truncation
        probs = F.softmax(v, dim=-1)                # 3. softmax over survivors
        choice = torch.multinomial(probs, num_samples=1, generator=generator)
        return ix.gather(-1, choice).squeeze(-1)    # multinomial draw</code></pre>

  <h3>Step 1 — Temperature</h3>
  <p>Divide every logit by a positive number T. After softmax:</p>
  <div class="math-block" data-tex="p_i = \\frac{e^{z_i / T}}{\\sum_j e^{z_j / T}}"></div>
  <ul>
    <li><strong>T = 1.0</strong>: no change.</li>
    <li><strong>T &lt; 1.0</strong> (e.g. 0.5): sharpens the distribution. Confident becomes more confident, unlikely becomes more unlikely. Outputs become more deterministic.</li>
    <li><strong>T &gt; 1.0</strong> (e.g. 1.5): flattens the distribution. Outputs become more random, more diverse.</li>
    <li><strong>T → 0</strong>: distribution collapses to a one-hot on the argmax — equivalent to greedy. nanochat shortcuts this case to skip the softmax/multinomial work.</li>
  </ul>

  <h3>Step 2 — Top-k truncation</h3>
  <p>Keep only the k logits with the highest values; set the rest to <code class="inl">-∞</code> (so they get zero probability after softmax). This removes the long tail of weird tokens entirely. Typical k for chat: 40–100.</p>
  <p>Implementation note: <code class="inl">torch.topk</code> returns both values and indices. We softmax just the k surviving values (much cheaper than softmaxing over the full vocab), draw from those, then map back to the original vocab id with <code class="inl">gather</code>.</p>

  <h3>Step 3 — Multinomial draw</h3>
  <p>Roll a biased die. <code class="inl">torch.multinomial(probs, 1)</code> returns an index sampled according to <code class="inl">probs</code>. The <code class="inl">generator</code> argument lets you pass a deterministic PRNG for reproducibility.</p>

  <h3>What about top-p?</h3>
  <p>Top-p (nucleus sampling) keeps the smallest set of tokens whose cumulative probability ≥ p. More adaptive than top-k (sometimes 5 tokens, sometimes 100 depending on entropy). nanochat ships only top-k for simplicity; top-p is a small extension if you want it.</p>
</section>

<section class="block">
  <p class="block-eyebrow">Alternatives</p>
  <h2>What else could you do?</h2>
  <div class="alts">
    <div class="alt"><div class="alt-name">Greedy (argmax)<span class="verdict meh">deterministic</span></div><div class="alt-desc">Always pick the top token. <strong>Pro:</strong> reproducible, no surprises. <strong>Con:</strong> repetitive, prone to loops in open-ended generation.</div></div>
    <div class="alt"><div class="alt-name">Top-p / nucleus<span class="verdict win">popular</span></div><div class="alt-desc">Keep the smallest set whose cumulative probability ≥ p (e.g. 0.9). <strong>Pro:</strong> adapts to the entropy of the moment. <strong>Con:</strong> one more knob; for confident next tokens it can keep just one option, for ambiguous ones it keeps many.</div></div>
    <div class="alt"><div class="alt-name">Beam search<span class="verdict meh">overkill</span></div><div class="alt-desc">Maintain k partial sequences in parallel, expand each, keep the top-k. <strong>Pro:</strong> great for translation, summarization. <strong>Con:</strong> slow, prone to bland generations in open-ended settings.</div></div>
    <div class="alt"><div class="alt-name">Mirostat<span class="verdict meh">niche</span></div><div class="alt-desc">Adaptive sampling that targets a fixed perplexity ("surprise") level over time. Interesting, less common.</div></div>
    <div class="alt"><div class="alt-name">Top-k + temperature<span class="verdict used">used</span></div><div class="alt-desc">nanochat's choice. Two clear knobs (temp, k) with intuitive effects; ~10 lines of code; well-suited to chat and instruction-following.</div></div>
  </div>
</section>
`});

CONCEPTS.push({
  id: 'kvcache', num: '15', tag: 'KVCache · engine.py:82',
  title: 'KV cache',
  deck: 'At decode time, recomputing K and V for every past token at every step would be O(T²) per token. The cache stores them once and grows by one slot per generated token.',
  body: `
<section class="block">
  <p class="block-eyebrow">Purpose</p>
  <h2>Why does this exist?</h2>
  <p>Imagine generating a 1000-token response. Without a cache:</p>
  <ul>
    <li>To generate token 1, run the full model on the prompt + 0 generated tokens.</li>
    <li>To generate token 2, run the full model on the prompt + 1 generated tokens.</li>
    <li>… To generate token 1000, run the full model on the prompt + 999 generated tokens.</li>
  </ul>
  <p>Total cost: <code class="inl">O(T²)</code> per layer, total <code class="inl">O(N · T²)</code> for the whole response. That's quadratic in the response length. For long responses it's painfully slow — most of the work is <em>recomputing the same K and V for past tokens</em>, over and over.</p>
  <p>The KV cache fixes this. K and V for past tokens never change (causal attention!), so we compute each once, store them, and on subsequent steps we only compute Q, K, V for the new token. New K and V get appended to the cache. Total cost drops to <code class="inl">O(T)</code> per token — linear.</p>

  <div class="analogy">
    <div class="label">Analogy</div>
    <p>Imagine taking minutes of a long meeting. Without a cache, every time someone speaks you re-write all the minutes from scratch. With a cache, you keep the running minutes and just append the new line. KV cache is the running-minutes approach for transformers.</p>
  </div>

  <div class="whatif">
    <div class="label">What if we didn't have it?</div>
    <p>You'd be 10× to 100× slower on inference. Long-form generation would be unusable. Real-time chat impossible. The cache is so important that essentially every serving system (vLLM, TGI, llama.cpp, …) is fundamentally built around clever KV-cache management — paging it, sharing it across requests, quantizing it. nanochat ships a clean reference implementation in <code class="inl">engine.py</code>.</p>
  </div>
</section>

<section class="block">
  <p class="block-eyebrow">Implementation</p>
  <h2>How does it actually work?</h2>

  <h3>The data structure</h3>
  <pre class="code"><code class="language-python">class KVCache:
    def __init__(self, batch_size, n_layers, max_seq_len, n_kv_head, head_dim, dtype, device):
        self.k_cache = torch.zeros(n_layers, batch_size, max_seq_len, n_kv_head, head_dim,
                                   dtype=dtype, device=device)
        self.v_cache = torch.zeros(n_layers, batch_size, max_seq_len, n_kv_head, head_dim,
                                   dtype=dtype, device=device)
        self.cache_seqlens = torch.zeros(batch_size, dtype=torch.int32, device=device)
        self.prev_embedding = torch.zeros(batch_size, 1, n_embd, dtype=dtype, device=device)</code></pre>
  <p>The cache is <strong>preallocated</strong> to <code class="inl">max_seq_len</code> at construction. No dynamic growth — we just fill it up. <code class="inl">cache_seqlens</code> tracks, per batch element, how many slots are currently used (so a batch of generations of different lengths can share the same cache).</p>
  <p><code class="inl">prev_embedding</code> is the cross-step state for the smear stage (see <a href="#smear">stage 4</a>).</p>

  <h3>Two phases: prefill and decode</h3>
  <p><strong>Prefill</strong>: the user gives a prompt of T tokens. We run the full model on all T at once (compute-bound, GPU loves this), and the cache gets filled with the K and V for all T positions.</p>
  <p><strong>Decode</strong>: we then generate one token at a time. Each step, run the model on a single new token. Compute its Q, K, V. Append K, V to the cache. Run attention with Q against the entire cache. Cost per step: <em>one</em> set of QKV projections + attention against (T + steps_so_far) cached K, V — much, much cheaper than re-running on the whole prefix.</p>

  <h3>How attention uses the cache</h3>
  <p>Flash Attention's <code class="inl">flash_attn_with_kvcache</code> takes Q (just the new token), the full cache tensors, and the new K, V (which it writes into the cache at <code class="inl">cache_seqlens</code> in-place). Then it does attention over <code class="inl">cache_seqlens + 1</code> positions and returns the result.</p>
  <pre class="code"><code class="language-python">y = flash_attn_with_kvcache(
    q, layer_kv.k_cache, layer_kv.v_cache,
    k=k, v=v,
    cache_seqlens=kv_cache.cache_seqlens,
    causal=True,
    window_size=(window_size_left, 0),
)
if self.layer_idx == self.config.n_layer - 1:
    kv_cache.cache_seqlens += T   # only advance once per step, after the last layer</code></pre>

  <h3>Memory footprint</h3>
  <p>For nanochat-d20 at max seq 2048, with batch 1, in bf16:</p>
  <div class="math-block" data-tex="\\text{K cache size} = n\\_layers \\cdot T \\cdot n\\_kv\\_head \\cdot D \\cdot 2\\,\\text{bytes}"></div>
  <div class="math-block" data-tex="= 20 \\cdot 2048 \\cdot 5 \\cdot 128 \\cdot 2 = 52\\,\\text{MB (and the same for V)}"></div>
  <p>Modest at this scale. At 70B parameters with 32k context the same arithmetic produces tens of GB — which is why production serving systems spend so much engineering effort on KV cache management.</p>

  <h3>Asymmetric workload</h3>
  <p>This is the key inference insight:</p>
  <ul>
    <li><strong>Prefill</strong> processes T tokens in parallel — compute-bound. GPUs sing.</li>
    <li><strong>Decode</strong> processes 1 token but reads the entire cache for every layer — bandwidth-bound. GPUs struggle.</li>
  </ul>
  <p>This is why GQA matters (smaller cache → less bandwidth), why sliding window matters (smaller effective cache), and why quantized KV caches are an active research area.</p>
</section>

<section class="block">
  <p class="block-eyebrow">Alternatives</p>
  <h2>What else could you do?</h2>
  <div class="alts">
    <div class="alt"><div class="alt-name">No cache (re-encode every step)<span class="verdict lose">unusable</span></div><div class="alt-desc">Run the full model on the entire prefix at every step. <strong>Pro:</strong> simple to implement. <strong>Con:</strong> O(T²) per token; long generations crawl. Nobody serves this in production.</div></div>
    <div class="alt"><div class="alt-name">Sliding-window cache<span class="verdict win">long context</span></div><div class="alt-desc">Drop the oldest cache entries past the window. <strong>Pro:</strong> bounded memory regardless of generated length. <strong>Con:</strong> loses access to very old tokens. Used by Mistral; nanochat could adopt the same with no architecture change since attention is already windowed.</div></div>
    <div class="alt"><div class="alt-name">PagedAttention (vLLM)<span class="verdict win">production</span></div><div class="alt-desc">Allocate cache in fixed-size pages, share pages across requests with common prefixes. <strong>Pro:</strong> massive throughput wins for serving. <strong>Con:</strong> serving-system complexity; overkill for a reference engine.</div></div>
    <div class="alt"><div class="alt-name">Quantized cache<span class="verdict win">memory savings</span></div><div class="alt-desc">Store K, V in int8 or int4 instead of bf16. <strong>Pro:</strong> 2-4× cache shrinkage. <strong>Con:</strong> small quality cost, kernel complexity. Big-context production setups use it.</div></div>
    <div class="alt"><div class="alt-name">Dense bf16 cache<span class="verdict used">used</span></div><div class="alt-desc">Preallocated, never paged or quantized. nanochat's choice — the clean reference design. Production systems layer paging and quantization on top of this same idea.</div></div>
  </div>
</section>
`});


// =============================================================================
// Rendering / routing
// =============================================================================
function el(tag, props={}, ...children) {
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  });
  children.flat().forEach(c => {
    if (c == null) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}

function buildAll() {
  const main = document.getElementById('content');
  CONCEPTS.forEach((c, i) => {
    const art = el('article', { id: c.id });
    const head = el('div', { class: 'art-head' },
      el('div', { class: 'art-eyebrow' },
        el('span', { class: 'num' }, c.num),
        el('span', { class: 'tag' }, c.tag)
      ),
      el('h1', { html: c.title }),
      el('p', { class: 'deck' }, c.deck)
    );
    art.appendChild(head);
    art.insertAdjacentHTML('beforeend', c.body);

    // prev / next
    const prev = i > 0 ? CONCEPTS[i - 1] : null;
    const next = i < CONCEPTS.length - 1 ? CONCEPTS[i + 1] : null;
    const pn = el('div', { class: 'pn' },
      prev
        ? el('a', { href: '#' + prev.id },
            el('div', { class: 'dir' }, '← previous'),
            el('div', { class: 'nxt-title' }, `${prev.num}. ${prev.title}`))
        : el('a', { class: 'disabled' }, el('div', { class: 'dir' }, '·')),
      next
        ? el('a', { class: 'next', href: '#' + next.id },
            el('div', { class: 'dir' }, 'next →'),
            el('div', { class: 'nxt-title' }, `${next.num}. ${next.title}`))
        : el('a', { class: 'disabled next' }, el('div', { class: 'dir' }, '·'))
    );
    art.appendChild(pn);

    art.appendChild(el('footer', { class: 'foot' },
      'concept ' + c.num + ' of ' + CONCEPTS.length + ' · ',
      el('a', { href: 'inference_visualization.html#' + c.id }, '↗ see this stage on the overview')
    ));

    main.appendChild(art);
  });

  // Build rail
  const rail = document.getElementById('railList');
  CONCEPTS.forEach(c => {
    const li = el('li', {},
      el('a', { class: 'chap', href: '#' + c.id, 'data-id': c.id }, c.title)
    );
    rail.appendChild(li);
  });
}

function show(id) {
  if (!id || !document.getElementById(id)) id = CONCEPTS[0].id;
  document.querySelectorAll('article').forEach(a => a.classList.toggle('active', a.id === id));
  document.querySelectorAll('.rail a.chap').forEach(a => a.classList.toggle('active', a.getAttribute('data-id') === id));
  // Update document title
  const c = CONCEPTS.find(x => x.id === id);
  if (c) document.title = c.num + '. ' + c.title + ' · concepts';
  window.scrollTo({ top: 0, behavior: 'instant' });

  // Render math and code in the now-active article
  const active = document.getElementById(id);
  active.querySelectorAll('div.math-block[data-tex]').forEach(d => {
    if (d.dataset.rendered) return;
    if (window.katex) {
      katex.render(d.dataset.tex, d, { displayMode: true, throwOnError: false });
      d.dataset.rendered = '1';
    }
  });
  active.querySelectorAll('pre.code code').forEach(b => {
    if (b.dataset.hl) return;
    if (window.hljs) { hljs.highlightElement(b); b.dataset.hl = '1'; }
  });
}

function init() {
  buildAll();
  show(location.hash.slice(1));
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
